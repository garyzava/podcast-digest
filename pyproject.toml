[project]
name = "podcast-digest"
version = "0.1.0"
description = "Podcast episode in, clean transcript and structured summary out. CLI for people and AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Gary Zavaleta" }]
keywords = ["podcast", "transcript", "summary", "youtube", "yt-dlp", "rss", "agents"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Text Processing",
]
dependencies = ["yt-dlp>=2026.1.1", "pyyaml>=6"]

[project.urls]
Repository = "https://github.com/garyzava/podcast-digest"

[project.scripts]
podcast = "podcast_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_digest"]
